# Arquivo de Configuração do ClusterForge (server.properties)
# Configurações ativas (Padrões)

# ==============================================================================
# Configurações do Servidor
# ==============================================================================

server.port=8080

# Host público de acesso (usado para gerar links de conexão)
# Se não definido, o frontend tentará detectar automaticamente ou usar 'localhost'
# clusterforge.access.host=meudominio.com
# clusterforge.access.protocol=http

# ==============================================================================
# Configurações Docker
# ==============================================================================

clusterforge.docker.host=unix:///var/run/docker.sock

# Caminhos para persistência
docker.templates.path=./data/templates
docker.volumes.basePath=./data/volumes

# Range de portas para alocação dinâmica (portas do host)
clusterforge.ports.range.start=9000
clusterforge.ports.range.end=9999

# Habilita/desabilita suporte a Docker Compose
spring.docker.compose.enabled=false

# ==============================================================================
# Banco de Dados (H2)
# ==============================================================================

spring.datasource.url=jdbc:h2:file:./data/db/clusterforge;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# Exemplo para MySQL (configurado automaticamente pelo install.sh se usar o container incluso)
# spring.datasource.url=jdbc:mysql://localhost:3306/clusterforge?allowPublicKeyRetrieval=true&useSSL=false
# spring.datasource.username=root
# spring.datasource.password=secret

# Configuração do Pool de Conexões (HikariCP)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=1800000

# ==============================================================================
# Segurança (JWT e Criptografia)
# ==============================================================================

clusterforge.jwt.secret-key=EkfuiHbDDRKk5lnz8atdft/wjizzSLwYpUNtNbrBRy8=
clusterforge.jwt.expiration-ms=86400000

clusterforge.security.encryption.key=yvRy5KPeCQqL78FFhzGA5hkVF7VAosCKQ5qJ7LY49kY=

# ==============================================================================
# WebDAV
# ==============================================================================

clusterforge.webdav.image=ghcr.io/hacdias/webdav:latest
clusterforge.webdav.timeout-seconds=30
clusterforge.webdav.cors.allow-all=true

# ==============================================================================
# CORS
# ==============================================================================

clusterforge.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002

# ==============================================================================
# Monitoramento e Logs
# ==============================================================================

clusterforge.monitoring.logs.retention-days=30
clusterforge.monitoring.metrics.retention-days=90

clusterforge.monitoring.cleanup.enabled=true
clusterforge.monitoring.cleanup.interval-ms=86400000

clusterforge.monitoring.logs.continuous-collection.enabled=true
clusterforge.monitoring.logs.continuous-collection.interval-ms=60000
clusterforge.monitoring.metrics.continuous-collection.enabled=true
clusterforge.monitoring.metrics.continuous-collection.interval-ms=60000

# ==============================================================================
# Tarefas Agendadas e Recuperação
# ==============================================================================

clusterforge.events.listener.enabled=true

clusterforge.ftp.recovery.enabled=true
clusterforge.ftp.recovery.interval-ms=300000
clusterforge.ftp.recovery.initial-delay-ms=60000
