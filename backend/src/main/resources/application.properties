spring.application.name=clusterforge
spring.docker.compose.enabled=false
clusterforge.docker.host=unix:///var/run/docker.sock
docker.templates.path=./data/templates
docker.volumes.basePath=./data/volumes
# Range de portas para alocação dinâmica (portas do host)
clusterforge.ports.range.start=9000
clusterforge.ports.range.end=9999
spring.datasource.url=jdbc:h2:file:./data/db/clusterforge;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# Configuração do pool de conexões HikariCP
# Aumentado para suportar múltiplas requisições simultâneas e transações assíncronas
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Timeout para detectar conexões vazadas (30 minutos)
spring.datasource.hikari.leak-detection-threshold=1800000

# Configuração do listener de eventos Docker em tempo real
# Habilita/desabilita o listener de eventos (padrão: true)
# Quando habilitado, atualiza o banco instantaneamente quando containers mudam de status
clusterforge.events.listener.enabled=true

# Configuração do serviço de recuperação de servidores FTP
# Habilita/desabilita o serviço de recuperação (padrão: true)
# Quando habilitado, verifica periodicamente containers sem servidor FTP e cria automaticamente
clusterforge.ftp.recovery.enabled=true
# Intervalo entre verificações em milissegundos (padrão: 5 minutos = 300000)
clusterforge.ftp.recovery.interval-ms=300000
# Atraso inicial antes da primeira verificação em milissegundos (padrão: 1 minuto = 60000)
clusterforge.ftp.recovery.initial-delay-ms=60000

# Configuração JWT
# Chave secreta para assinatura dos tokens JWT (em produção, usar chave forte gerada aleatoriamente)
clusterforge.jwt.secret-key=EkfuiHbDDRKk5lnz8atdft/wjizzSLwYpUNtNbrBRy8=
# Tempo de expiração do token em milissegundos (padrão: 24 horas = 86400000)
clusterforge.jwt.expiration-ms=86400000

# Configuração WebDAV (imagem usada para expor volumes via HTTP)
clusterforge.webdav.image=ghcr.io/hacdias/webdav:latest
# Timeout de conexão para requisições WebDAV em segundos (padrão: 30)
clusterforge.webdav.timeout-seconds=30
# Permitir todas as origens no CORS do WebDAV (padrão: true para desenvolvimento)
# Em produção, definir como false e usar clusterforge.cors.allowed-origins
clusterforge.webdav.cors.allow-all=true

# Configuração CORS
# Origens permitidas para requisições CORS (separadas por vírgula)
# Valores padrão para desenvolvimento: localhost nas portas 3000, 3001, 3002
clusterforge.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002

# Configuração de retenção de logs e métricas
# Número de dias para manter logs no banco de dados (padrão: 30 dias)
clusterforge.monitoring.logs.retention-days=30
# Número de dias para manter métricas no banco de dados (padrão: 90 dias)
clusterforge.monitoring.metrics.retention-days=90
# Habilitar limpeza automática de dados antigos (padrão: true)
clusterforge.monitoring.cleanup.enabled=true
# Intervalo entre limpezas automáticas em milissegundos (padrão: 24 horas = 86400000)
clusterforge.monitoring.cleanup.interval-ms=86400000

# Configuração de coleta contínua de logs
# Habilita coleta contínua de logs para todos os containers ativos (padrão: true)
# Quando habilitado, coleta logs independentemente de ter clientes SSE conectados
clusterforge.monitoring.logs.continuous-collection.enabled=true
# Intervalo entre verificações de containers ativos em milissegundos (padrão: 1 minuto = 60000)
clusterforge.monitoring.logs.continuous-collection.interval-ms=60000

# Configuração de coleta contínua de métricas
# Habilita coleta contínua de métricas para todos os containers ativos (padrão: true)
# Quando habilitado, coleta métricas independentemente de ter clientes SSE conectados
clusterforge.monitoring.metrics.continuous-collection.enabled=true
# Intervalo entre verificações de containers ativos em milissegundos (padrão: 1 minuto = 60000)
clusterforge.monitoring.metrics.continuous-collection.interval-ms=60000