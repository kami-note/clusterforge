# Configuração de teste para usar Docker real
# Este arquivo é usado quando DOCKER_REAL_TESTS=1 está definido

# Configuração do Docker
clusterforge.docker.host=unix:///var/run/docker.sock

# Configuração de templates e volumes para testes
docker.templates.path=${java.io.tmpdir}/clusterforge-test-templates
docker.volumes.basePath=${java.io.tmpdir}/clusterforge-test-volumes

# Configuração do banco de dados H2 em memória
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Desabilitar listener de eventos Docker em testes (opcional, pode ser habilitado)
clusterforge.events.listener.enabled=false

# Desabilitar recuperação de FTP em testes
clusterforge.ftp.recovery.enabled=false

# Configuração JWT para testes
clusterforge.jwt.secret-key=test-secret-key-for-unit-tests-only
clusterforge.jwt.expiration-ms=3600000

# Configuração WebDAV
clusterforge.webdav.image=ghcr.io/hacdias/webdav:latest
clusterforge.webdav.timeout-seconds=30
clusterforge.webdav.cors.allow-all=true

# Configuração CORS para testes
clusterforge.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Desabilitar coleta contínua em testes
clusterforge.monitoring.logs.continuous-collection.enabled=false
clusterforge.monitoring.metrics.continuous-collection.enabled=false
clusterforge.monitoring.cleanup.enabled=false

